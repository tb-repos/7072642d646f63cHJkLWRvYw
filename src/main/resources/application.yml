spring:
  application:
    name: tourbhook-enterprise-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tourbhook}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 480000
      keepalive-time: 240000
      connection-timeout: 30000
      validation-timeout: 5000

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false

server:
  port: 8080

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    geocoding-url: https://maps.googleapis.com/maps/api/geocode/json
    places-nearby-url: https://places.googleapis.com/v1/places:searchNearby
    places-text-search-url: https://places.googleapis.com/v1/places:searchText
    weather-url: https://weather.googleapis.com/v1/currentConditions:lookup
    directions-url: https://maps.googleapis.com/maps/api/directions/json

moderation:
  banned-terms:
    - scam
    - spam-link
  blocked-domains:
    - malicious-example.test

itinerary:
  rating-weighting:
    threshold: 4.5
    boost-weight: 2.0

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3.6-flash
  base-url: https://generativelanguage.googleapis.com/v1beta/models

review-summary:
  regeneration-threshold: 10

app:
  base-url: http://32.193.3.150:8080
  upload-dir: ${user.dir}/uploads
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-expiration-ms: 86400000
      refresh-token-expiration-ms: 604800000

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  currency: INR

language:
  supported:
    - code: en
      english-name: English
      native-name: English
      tier: 1
    - code: de
      english-name: German
      native-name: Deutsch
      tier: 2
    - code: zh
      english-name: Chinese
      native-name: 中文
      tier: 2
    - code: mr
      english-name: Marathi
      native-name: मराठी
      tier: 2
    - code: kn
      english-name: Kannada
      native-name: ಕನ್ನಡ
      tier: 2
    - code: gu
      english-name: Gujarati
      native-name: ગુજરાતી
      tier: 2
    - code: raj
      english-name: Rajasthani
      native-name: राजस्थानी
      tier: 2
    - code: or
      english-name: Odia
      native-name: ଓଡ଼ିଆ
      tier: 2